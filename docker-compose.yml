name: streamingmovies

services:
  db:
    image: postgres:16
    container_name: compose-movies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moviesdb}
      POSTGRES_USER: ${DB_USERNAME:-moviesuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - compose-postgres-data:/var/lib/postgresql/data
    networks:
      - compose-backend-network
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: streamingmovies-api-compose:1.0
    container_name: compose-movies-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-moviesdb}
      DB_USERNAME: ${DB_USERNAME:-moviesuser}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "8080:8080"
    networks:
      - compose-backend-network
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 256M

volumes:
  compose-postgres-data:

networks:
  compose-backend-network:
    driver: bridge
